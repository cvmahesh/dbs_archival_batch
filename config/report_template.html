<!DOCTYPE html>
<html>
<head>
    <title>Directory Processing Report</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            width: 100%;
        }
        h1 {
            color: white;
            background-color: red;
            font-size: 32px;
            padding: 10px;
            margin: 20px auto;
            border-radius: 8px;
            width: 90%;
        }
        h2 {
            color: white;
            background-color: red;
            font-size: 24px;
            padding: 10px;
            margin-top: 30px;
            margin-left: 20%;
            margin-right: 20%;
            border-radius: 5px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 10px;
            margin: 10px;
            background-color: white;
            color: black;
            font-size: 18px;
            border-radius: 5px;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        li:hover {
            background-color: lightgray;
            color: black;
        }
        table {
            width: 100%;
            border-spacing: 0;
            padding: 0;
        }
        td {
            padding: 0 10px;
        }
        th {
            #background-color: #f2f2f2;
            width: 100%;
        }
        .center-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        table.pretty-table {
            margin-left: auto;
            margin-right: auto;
            width: 60%;
            border-collapse: collapse;
        }
        table.pretty-table th,
        table.pretty-table td {
            border: 1px solid white;
            padding: 10px;
            text-align: center;
        }
        table.pretty-table th {
            background-color: red;
            color: white;
        }
        table.pretty-table td {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <table border=1 align="center" width="100%" cellspacing="0" cellpadding="10" style="background-color: black;">
        <tr>
            <td align="center" style="padding: 20px;">
                <h1>Archival Batch Processing Report</h1>
                <h2>Ignored Items</h2>
                <ul>
                    {% for item in ignore_items %}
                        <li>{{ item }}</li>
                    {% endfor %}
                </ul>
                <h2>Processed Directories</h2>
                <ul>
                    {% for dir in processed_dir_items %}
                        <li>{{ dir }}</li>
                    {% endfor %}
                </ul>
                <h2>Pretty Report</h2>
                <div>
                    {{ table_html|safe }}
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
